# .github/workflows/upload-ios.yml
# Lädt eine von Base44 signierte IPA (Release-Asset) nach App Store Connect / TestFlight.
# Baut NICHTS – die IPA entsteht ausschließlich in Base44.

name: Upload iOS build to TestFlight

on:
  release:
    types: [published]          # nur explizit veröffentlichte Releases, nie Base44-Pushes
  workflow_dispatch:            # manueller Fallback / Re-Upload / Dry-Run
    inputs:
      tag:
        description: "Release-Tag mit IPA-Asset (z. B. ios-v1.0.0-3)"
        required: true
        type: string
      dry_run:
        description: "Nur IPA prüfen, nicht hochladen"
        type: boolean
        default: false
      wait_for_processing:
        description: "Auf Apple-Processing warten und Export-Compliance setzen (kostet Runner-Minuten)"
        type: boolean
        default: false

permissions:
  contents: read                # reicht für gh release download

concurrency:
  group: ios-upload-${{ github.repository }}
  cancel-in-progress: false     # laufenden Upload nie abbrechen

jobs:
  upload:
    # Guard: Release-Trigger nur für Tags mit Präfix ios-v
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'ios-v')
    runs-on: macos-26           # gepinnt statt macos-latest
    timeout-minutes: 45
    environment: app-store      # Secrets + Required Reviewers liegen hier

    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      DRY_RUN: ${{ inputs.dry_run == true }}
      WAIT: ${{ inputs.wait_for_processing == true }}
      EXPECTED_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}   # optional
      ASC_APP_ID: ${{ vars.ASC_APP_ID }}              # optional, numerische Apple ID der App
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_CHANGELOG: "1"
      FASTLANE_OPT_OUT_USAGE: "1"
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8

    steps:
      - name: Download IPA from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/ios"            # runner.temp ist auf Job-Ebene nicht verfügbar
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          mkdir -p "$WORK"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.ipa' --dir "$WORK"
          count=$(find "$WORK" -maxdepth 1 -name '*.ipa' | wc -l | tr -d ' ')
          [ "$count" = "1" ] || { echo "::error::Erwarte genau 1 .ipa im Release $TAG, gefunden: $count"; exit 1; }
          echo "IPA_PATH=$(find "$WORK" -maxdepth 1 -name '*.ipa')" >> "$GITHUB_ENV"

      - name: Inspect IPA (bundle id, version, signature)
        run: |
          set -euo pipefail
          cd "$WORK"
          unzip -q "$IPA_PATH" -d extracted
          APP=$(find extracted/Payload -maxdepth 1 -name '*.app' | head -n1)
          PLIST="$APP/Info.plist"
          BID=$(plutil -extract CFBundleIdentifier raw -o - "$PLIST")
          VER=$(plutil -extract CFBundleShortVersionString raw -o - "$PLIST")
          BUILD=$(plutil -extract CFBundleVersion raw -o - "$PLIST")
          FAMILY=$(plutil -extract UIDeviceFamily json -o - "$PLIST" 2>/dev/null || echo "n/a")
          ENC=$(plutil -extract ITSAppUsesNonExemptEncryption raw -o - "$PLIST" 2>/dev/null || echo "nicht gesetzt")

          # Signatur muss intakt sein (IPA wird nicht verändert)
          codesign --verify --deep --strict "$APP"
          AUTH=$(codesign -dvv "$APP" 2>&1 | grep -m1 '^Authority=' || true)

          {
            echo "### IPA $TAG"
            echo "| Feld | Wert |"; echo "|---|---|"
            echo "| Bundle ID | \`$BID\` |"
            echo "| Version (CFBundleShortVersionString) | $VER |"
            echo "| Build (CFBundleVersion) | $BUILD |"
            echo "| UIDeviceFamily (1=iPhone, 2=iPad) | $FAMILY |"
            echo "| ITSAppUsesNonExemptEncryption | $ENC |"
            echo "| Signatur | $AUTH |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$EXPECTED_BUNDLE_ID" ] && [ "$BID" != "$EXPECTED_BUNDLE_ID" ]; then
            echo "::error::Bundle-ID-Mismatch: IPA=$BID, erwartet=$EXPECTED_BUNDLE_ID"; exit 1
          fi
          # Soft-Check: Tag-Konvention ios-v<Version>-<Build>
          [ "$TAG" = "ios-v$VER-$BUILD" ] || echo "::warning::Tag $TAG passt nicht zu ios-v$VER-$BUILD"
          rm -rf extracted

      - name: Write App Store Connect API key (temp, 0600)
        if: env.DRY_RUN != 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_B64: ${{ secrets.ASC_KEY_P8_B64 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, sys
          key = base64.b64decode(os.environ["ASC_KEY_P8_B64"]).decode()
          if "BEGIN PRIVATE KEY" not in key:
              sys.exit("::error::ASC_KEY_P8_B64 ist kein gültiger .p8-Key")
          path = os.path.join(os.environ["RUNNER_TEMP"], "asc_api_key.json")
          fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
          with os.fdopen(fd, "w") as f:
              json.dump({"key_id": os.environ["ASC_KEY_ID"],
                         "issuer_id": os.environ["ASC_ISSUER_ID"],
                         "key": key, "in_house": False}, f)
          PY
          echo "KEY_JSON=$RUNNER_TEMP/asc_api_key.json" >> "$GITHUB_ENV"

      - name: Upload to TestFlight (fastlane pilot)
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          SKIP_WAIT=true; [ "$WAIT" = "true" ] && SKIP_WAIT=false
          args=(pilot upload
                --ipa "$IPA_PATH"
                --api_key_path "$KEY_JSON"
                --skip_waiting_for_build_processing "$SKIP_WAIT")
          # Nur wirksam, wenn auf Processing gewartet wird
          [ "$SKIP_WAIT" = "false" ] && args+=(--uses_non_exempt_encryption false --distribute_external false)
          [ -n "$ASC_APP_ID" ] && args+=(--apple_id "$ASC_APP_ID")
          fastlane "${args[@]}"

      - name: Cleanup key and IPA
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/asc_api_key.json"
          rm -rf "$RUNNER_TEMP/ios"# .github/workflows/upload-ios.yml
